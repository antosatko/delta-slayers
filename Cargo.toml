[workspace]
members = ["crates/delta-slayers-ui"]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.20.1", features = ["dynamic_linking", "webp", "jpeg", "bevy_feathers"] }

[package]
name = "delta-slayers"
version = "0.1.0"
edition = "2024"

[dependencies]
delta-slayers-ui = { path = "crates/delta-slayers-ui" }
bevy = { workspace = true }
bevy_skein = "0.7.0"
bevy_grass = "0.20.6"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
